[package]
name = "value-setter-zk-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "value_setter"
path = "src/bin/value_setter.rs"

[dependencies]
risc0-zkvm = { version = "2.3", default-features = false, features = ['std'] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
sov-value-setter-zk = { path = "../.." }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "3dccc5b71b806f500e73829e2a5cbfe288cce2a0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }

